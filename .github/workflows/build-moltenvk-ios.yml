name: Build MoltenVK for iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Fetch MoltenVK source
        run: |
          git clone https://github.com/shadPS4-emu/ext-MoltenVK.git externals/MoltenVK
          cd externals/MoltenVK
          git checkout a14cbf433414aa95da7046694b069f0f3f9263a5

      - name: Prepare build cache
        run: mkdir -p "$HOME/.cache/CPM"

      - name: Patch MoltenVK for iOS
        run: |
          python3 - <<'PATCH'
          from pathlib import Path
          p = Path("externals/MoltenVK/Common/CMakeLists.txt")
          s = p.read_text()
          old = "find_library(APPKIT_LIBRARY AppKit)"
          if old not in s:
              old = "find_library(APPKIT_LIBRARY AppKit REQUIRED)"
          if old not in s:
              print("AppKit lookup context:")
              for i, line in enumerate(s.splitlines(), 1):
                  if "APPKIT_LIBRARY" in line or "find_library" in line:
                      print(f"{i}: {line}")
              raise SystemExit("AppKit lookup not matched; stopping.")
          s = s.replace(old, 'if(NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")\\n    ' + old + '\\nendif()', 1)
          p.write_text(s)
          print("Patched AppKit lookup for iOS.")
          PATCH
          grep -n -C 3 APPKIT_LIBRARY externals/MoltenVK/Common/CMakeLists.txt

      - name: Configure MoltenVK
        run: |
          cmake -S externals/MoltenVK -B build-moltenvk-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DMVK_BUILD_SHADER_CONVERTER_TOOL=OFF \
            -DMVK_EXCLUDE_SPIRV_TOOLS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build MoltenVK
        run: |
          cmake --build build-moltenvk-ios \
            --config Release \
            --target MoltenVK

      - name: Package framework
        run: |
          FRAMEWORK="$(find build-moltenvk-ios -type d -name MoltenVK.framework -print -quit)"
          test -n "$FRAMEWORK" || {
            echo "MoltenVK.framework was not generated"
            exit 1
          }
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc "$FRAMEWORK" artifacts/MoltenVK-iOS.zip

      - name: Upload iOS framework
        uses: actions/upload-artifact@v4
        with:
          name: MoltenVK-iOS-arm64
          path: artifacts/MoltenVK-iOS.zip
          if-no-files-found: error
          retention-days: 14
