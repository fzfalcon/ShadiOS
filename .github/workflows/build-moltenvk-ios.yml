name: Build MoltenVK for iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Fetch MoltenVK source
        run: |
          git clone https://github.com/shadPS4-emu/ext-MoltenVK.git externals/MoltenVK
          cd externals/MoltenVK
          git checkout a14cbf433414aa95da7046694b069f0f3f9263a5

      - name: Prepare build cache
        run: mkdir -p "$HOME/.cache/CPM"

      - name: Patch MoltenVK for iOS
        run: |
          python3 - <<'PATCH'
          from pathlib import Path

          p = Path("externals/MoltenVK/Common/CMakeLists.txt")
          lines = p.read_text().splitlines()
          result = []
          patched = False

          for line in lines:
              if "find_library(APPKIT_LIBRARY" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  result.append(indent + 'if(NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")')
                  result.append("    " + line)
                  result.append(indent + "endif()")
                  patched = True
              else:
                  result.append(line)

          if not patched:
              raise SystemExit("AppKit lookup not found; stopping safely.")

          p.write_text("\\n".join(result) + "\\n")
          print("AppKit lookup patched.")
          PATCH
          grep -n -C 3 APPKIT_LIBRARY externals/MoltenVK/Common/CMakeLists.txt

      - name: Disable shader converter for iOS
        run: |
          python3 - <<'PATCH'
          from pathlib import Path
          p = Path("externals/MoltenVK/CMakeLists.txt")
          s = p.read_text()
          old = 'add_subdirectory("MoltenVKShaderConverter/MoltenVKShaderConverter")'
          if old not in s:
              raise SystemExit("Expected shader converter line not found")
          s = s.replace(old, 'if(MVK_BUILD_SHADER_CONVERTER_TOOL)\n    ' + old + '\nendif()', 1)
          p.write_text(s)
          PATCH
          sed -n '96,115p' externals/MoltenVK/CMakeLists.txt

      - name: Patch MoltenVK target dependencies
        run: |
          python3 - <<'PATCH'
          from pathlib import Path
          p = Path("externals/MoltenVK/MoltenVK/CMakeLists.txt")
          s = p.read_text()
          old = '    MoltenVK::ShaderConverter'
          if old not in s:
              raise SystemExit("ShaderConverter link not found; stopping safely.")
          s = s.replace(old, '    $<$<BOOL:${MVK_BUILD_SHADER_CONVERTER_TOOL}>:MoltenVK::ShaderConverter>', 1)
          p.write_text(s)
          print("Patched ShaderConverter link.")
          PATCH
          grep -n -C 3 ShaderConverter externals/MoltenVK/MoltenVK/CMakeLists.txt

      - name: Configure MoltenVK
        run: |
          cmake -S externals/MoltenVK -B build-moltenvk-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DMVK_BUILD_SHADER_CONVERTER_TOOL=OFF \
            -DMVK_EXCLUDE_SPIRV_TOOLS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build MoltenVK
        run: |
          cmake --build build-moltenvk-ios \
            --config Release \
            --target MoltenVK

      - name: Package framework
        run: |
          FRAMEWORK="$(find build-moltenvk-ios -type d -name MoltenVK.framework -print -quit)"
          test -n "$FRAMEWORK" || {
            echo "MoltenVK.framework was not generated"
            exit 1
          }
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc "$FRAMEWORK" artifacts/MoltenVK-iOS.zip

      - name: Upload iOS framework
        uses: actions/upload-artifact@v4
        with:
          name: MoltenVK-iOS-arm64
          path: artifacts/MoltenVK-iOS.zip
          if-no-files-found: error
          retention-days: 14
