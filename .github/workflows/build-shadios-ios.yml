
      - name: Patch ImGuiFileDialog for iOS
        working-directory: ShadiOS/upstream-shadPS4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("externals/ImGuiFileDialog/ImGuiFileDialog.cpp")
          text = path.read_text()

          marker = "SHADIOS_IOS_SYSTEM_PATCH"

          if marker in text:
              print("ImGuiFileDialog iOS patch already applied.")
              raise SystemExit(0)

          old = "std::system(buffer);"
          count = text.count(old)

          if count != 2:
              raise SystemExit(
                  f"Expected 2 std::system(buffer) calls, found {count}. "
                  "Source differs from the log; stopping safely."
              )

          replacement = """\
          #if defined(__APPLE__)
                  -1  // Shell commands are unavailable on iOS.
          #else
                  std::system(buffer)
          #endif"""

          # Replace both calls while preserving each surrounding expression.
          text = text.replace(
              old,
              """/* SHADIOS_IOS_SYSTEM_PATCH */
          #if defined(__APPLE__)
                  -1
          #else
                  std::system(buffer)
          #endif""",
          )

          path.write_text(text)

          if text.count(marker) != 2:
              raise SystemExit("Verification failed: expected both patched calls.")

          print("Both ImGuiFileDialog system() calls patched.")
          PY
