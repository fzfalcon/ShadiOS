
name: Build ShadiOS iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4
        with:
          path: ShadiOS

      - name: Checkout official shadPS4
        uses: actions/checkout@v4
        with:
          repository: shadps4-emu/shadPS4
          ref: c7e065d1b415be16c23e260a21f1dd8bbfc4cb57
          path: ShadiOS/upstream-shadPS4
          submodules: recursive

      - name: Apply ShadiOS iOS patch
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          git apply --check ../../ShadiOS/shadios-ios-changes.patch
          git apply ../../ShadiOS/shadios-ios-changes.patch

      - name: Verify iOS source
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          test -f src/platform/ios/shadps4_ios_api.cpp
          grep -n -A15 'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")' CMakeLists.txt

      - name: Install build tools
        run: |
          brew install cmake ninja pkg-config

      - name: Configure iOS ARM64
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          cmake -S . -B build-shadios-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF

      - name: Build emulator library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          cmake --build build-shadios-ios \
            --target shadps4 --parallel 3

      - name: Package library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          mkdir -p ../shadios-artifact
          find build-shadios-ios -type f -name 'libshadps4.a' \
            -exec cp {} ../shadios-artifact/ \;
          test -f ../shadios-artifact/libshadps4.a
          xcrun lipo -info ../shadios-artifact/libshadps4.a
          cp build-shadios-ios/CMakeCache.txt ../shadios-artifact/

      - name: Upload iOS ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-iOS-arm64-library
          path: ShadiOS/shadios-artifact/
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-build-diagnostics
          path: |
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeFiles/CMakeConfigureLog.yaml
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeCache.txt
          if-no-files-found: ignore
