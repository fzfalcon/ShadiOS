name: Build ShadiOS iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4
        with:
          ref: main
          path: ShadiOS

      - name: Checkout official shadPS4
        uses: actions/checkout@v4
        with:
          repository: shadps4-emu/shadPS4
          ref: c7e065d1b415be16c23e260a21f1dd8bbfc4cb57
          path: ShadiOS/upstream-shadPS4
          submodules: recursive

      - name: Apply ShadiOS iOS patch
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          test -f ../shadios-ios-changes.patch
          git apply --check ../shadios-ios-changes.patch
          git apply ../shadios-ios-changes.patch

      - name: Diagnose iOS libusb backend
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -u
          echo "=== libusb CMake iOS references ==="
          grep -n -A8 -B4 'iOS' externals/libusb/CMakeLists.txt || true
          echo "=== null_usb.c locations ==="
          find externals/libusb -name 'null_usb.c' -print || true
          echo "=== libusb OS source directory ==="
          ls -la externals/libusb/libusb/os || true

      - name: Verify iOS source
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          test -f src/platform/ios/shadps4_ios_api.cpp
          grep -n -A15 'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")' CMakeLists.txt

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install cmake ninja pkg-config

      - name: Fetch MoltenVK dependency
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          if [ ! -d externals/MoltenVK/.git ]; then
            rm -rf externals/MoltenVK
            git clone https://github.com/shadPS4-emu/ext-MoltenVK.git \
              externals/MoltenVK
          fi
          git -C externals/MoltenVK checkout \
            a14cbf433414aa95da7046694b069f0f3f9263a5
          test -f externals/MoltenVK/CMakeLists.txt

      - name: Patch MoltenVK for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path("externals/MoltenVK/Common/CMakeLists.txt")
          text = path.read_text()

          if re.search(
              r'elseif\s*\(\s*CMAKE_SYSTEM_NAME\s+STREQUAL\s+"iOS"\s*\)',
              text,
          ):
              print("iOS AppKit guard already exists")
          else:
              pattern = re.compile(
                  r'if\s*\(\s*CMAKE_SYSTEM_NAME\s+STREQUAL\s+"Darwin"\s*\)'
                  r'(?:(?!endif\s*\(\s*\)).)*'
                  r'endif\s*\(\s*\)',
                  re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(
                      "ERROR: Darwin CMake block not found; refusing to modify MoltenVK"
                  )

              block = match.group(0)
              if "APPKIT_LIBRARY" not in block:
                  raise SystemExit(
                      "ERROR: Darwin block has no APPKIT_LIBRARY reference"
                  )

              replacement = re.sub(
                  r'endif\s*\(\s*\)\s*$',
                  'elseif (CMAKE_SYSTEM_NAME STREQUAL "iOS")\n'
                  '    # AppKit is unavailable on iOS.\n'
                  'endif()',
                  block,
              )
              path.write_text(
                  text[:match.start()] + replacement + text[match.end():]
              )
              print("Applied iOS AppKit guard")

          updated = path.read_text()
          print("=== MoltenVK AppKit references ===")
          for line_number, line in enumerate(updated.splitlines(), 1):
              if "APPKIT_LIBRARY" in line or 'STREQUAL "iOS"' in line:
                  print(f"{line_number}: {line}")
          PYTHON

      - name: Configure iOS ARM64
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$IOS_SDK"
          cmake -S . -B build-shadios-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF

      - name: Build emulator library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          cmake --build build-shadios-ios \
            --target shadps4 \
            --parallel 3

      - name: Package library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          mkdir -p ../shadios-artifact
          find build-shadios-ios \
            -type f \
            -name 'libshadps4.a' \
            -exec cp {} ../shadios-artifact/ \;
          test -f ../shadios-artifact/libshadps4.a
          xcrun lipo -info ../shadios-artifact/libshadps4.a
          cp build-shadios-ios/CMakeCache.txt \
            ../shadios-artifact/

      - name: Upload iOS ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-iOS-arm64-library
          path: ShadiOS/shadios-artifact/
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-build-diagnostics
          path: |
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeFiles/CMakeConfigureLog.yaml
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeCache.txt
          if-no-files-found: ignore
