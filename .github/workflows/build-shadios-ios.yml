name: Build ShadiOS iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4
        with:
          ref: main
          path: ShadiOS

      - name: Checkout official shadPS4
        uses: actions/checkout@v4
        with:
          repository: shadps4-emu/shadPS4
          ref: c7e065d1b415be16c23e260a21f1dd8bbfc4cb57
          path: ShadiOS/upstream-shadPS4
          submodules: recursive

      - name: Apply ShadiOS iOS patch
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          test -f ../shadios-ios-changes.patch
          git apply --check ../shadios-ios-changes.patch
          git apply ../shadios-ios-changes.patch

      - name: Patch libusb for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          p = Path("externals/libusb/CMakeLists.txt")
          s = p.read_text()

          old = '''    elseif(APPLE)
              target_sources(usb-1.0 PRIVATE
                  "${LIBUSB_ROOT}/os/darwin_usb.c"
                  "${LIBUSB_ROOT}/os/darwin_usb.h"
              )
              target_link_libraries(usb-1.0 PRIVATE
                  "-framework Foundation"
                  "-framework IOKit"
                  "-framework Security"
              )'''

          new = '''    elseif(CMAKE_SYSTEM_NAME STREQUAL "iOS")
              target_sources(usb-1.0 PRIVATE
                  "${LIBUSB_ROOT}/os/null_usb.c"
              )
          elseif(APPLE)
              target_sources(usb-1.0 PRIVATE
                  "${LIBUSB_ROOT}/os/darwin_usb.c"
                  "${LIBUSB_ROOT}/os/darwin_usb.h"
              )
              target_link_libraries(usb-1.0 PRIVATE
                  "-framework Foundation"
                  "-framework IOKit"
                  "-framework Security"
              )'''

          if new in s:
              print("iOS libusb patch already applied")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("Applied iOS libusb patch")
          else:
              raise SystemExit(
                  "ERROR: Expected libusb platform block not found"
              )
          PYTHON

      - name: Verify iOS source and USB patch
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          test -f src/platform/ios/shadps4_ios_api.cpp
          grep -n -A 15 'STREQUAL "iOS"' externals/libusb/CMakeLists.txt
          grep -n -A 15 'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")' CMakeLists.txt

      - name: Install build tools
        run: |
          brew install cmake ninja pkg-config

      - name: Fetch MoltenVK dependency
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          git clone https://github.com/shadPS4-emu/ext-MoltenVK.git externals/MoltenVK
          git -C externals/MoltenVK checkout a14cbf433414aa95da7046694b069f0f3f9263a5
          test -f externals/MoltenVK/CMakeLists.txt

      - name: Patch MoltenVK for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          p = Path("externals/MoltenVK/Common/CMakeLists.txt")
          s = p.read_text()

          old = '''        find_library(APPKIT_LIBRARY AppKit REQUIRED)
          target_link_libraries(MoltenVK_Common PUBLIC ${APPKIT_LIBRARY})'''

          new = '''        if(NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")
            find_library(APPKIT_LIBRARY AppKit REQUIRED)
            target_link_libraries(MoltenVK_Common PUBLIC ${APPKIT_LIBRARY})
          endif()'''

          if new in s:
              print("MoltenVK AppKit guard already present")
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print("Patched MoltenVK AppKit guard")
          else:
              raise SystemExit(
                  "ERROR: Expected AppKit block not found"
              )

          p = Path("externals/MoltenVK/CMakeLists.txt")
          s = p.read_text()

          marker = 'add_subdirectory("MoltenVK")'
          addition = '''
          if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
              target_link_libraries(MoltenVK PRIVATE "-framework UIKit" "-framework CoreGraphics")
          endif()'''

          if "framework UIKit" not in s:
              if marker not in s:
                  raise SystemExit(
                      "ERROR: MoltenVK target declaration not found"
                  )
              p.write_text(s.replace(marker, marker + addition, 1))
              print("Added iOS framework links")
          else:
              print("iOS framework links already present")
          PYTHON

          grep -n -C 2 APPKIT_LIBRARY externals/MoltenVK/Common/CMakeLists.txt

      - name: Configure iOS ARM64
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$IOS_SDK"

          cmake -S . -B build-shadios-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF

      - name: Build emulator library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          cmake --build build-shadios-ios \
            --target shadps4 \
            --parallel 3

      - name: Package library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          mkdir -p ../shadios-artifact

          find build-shadios-ios \
            -type f \
            -name 'libshadps4.a' \
            -exec cp {} ../shadios-artifact/ \;

          test -f ../shadios-artifact/libshadps4.a

          xcrun lipo -info ../shadios-artifact/libshadps4.a

          cp build-shadios-ios/CMakeCache.txt \
            ../shadios-artifact/

      - name: Upload iOS ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-iOS-arm64-library
          path: ShadiOS/shadios-artifact/
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-build-diagnostics
          path: |
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeFiles/CMakeConfigureLog.yaml
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeCache.txt
          if-no-files-found: ignore
