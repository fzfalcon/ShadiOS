name: Build ShadiOS iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4
        with:
          ref: main
          path: ShadiOS

      - name: Checkout official shadPS4
        uses: actions/checkout@v4
        with:
          repository: shadps4-emu/shadPS4
          ref: c7e065d1b415be16c23e260a21f1dd8bbfc4cb57
          path: ShadiOS/upstream-shadPS4
          submodules: recursive

      - name: Apply ShadiOS iOS patch
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          test -f ../shadios-ios-changes.patch
          git apply --check ../shadios-ios-changes.patch
          git apply ../shadios-ios-changes.patch

      - name: Patch libusb for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path("externals/libusb/CMakeLists.txt")
          source = path.read_text()

          old = "\n".join([
              "    elseif(APPLE)",
              "        target_sources(usb-1.0 PRIVATE",
              '            "${LIBUSB_ROOT}/os/darwin_usb.c"',
              '            "${LIBUSB_ROOT}/os/darwin_usb.h"',
              "        )",
              "        target_link_libraries(usb-1.0 PRIVATE",
              '            "-framework Foundation"',
              '            "-framework IOKit"',
              '            "-framework Security"',
              "        )",
          ])

          new = "\n".join([
              '    elseif(CMAKE_SYSTEM_NAME STREQUAL "iOS")',
              "        target_sources(usb-1.0 PRIVATE",
              '            "${LIBUSB_ROOT}/os/null_usb.c"',
              "        )",
              "    elseif(APPLE)",
              "        target_sources(usb-1.0 PRIVATE",
              '            "${LIBUSB_ROOT}/os/darwin_usb.c"',
              '            "${LIBUSB_ROOT}/os/darwin_usb.h"',
              "        )",
              "        target_link_libraries(usb-1.0 PRIVATE",
              '            "-framework Foundation"',
              '            "-framework IOKit"',
              '            "-framework Security"',
              "        )",
          ])

          if new in source:
              print("iOS libusb patch already present")
          elif old in source:
              path.write_text(source.replace(old, new, 1))
              print("Applied iOS libusb patch")
          else:
              raise SystemExit(
                  "ERROR: Expected libusb CMake block not found. "
                  "No changes were made."
              )
          PYTHON

      - name: Verify iOS source
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          test -f src/platform/ios/shadps4_ios_api.cpp
          grep -n -A15 'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")' CMakeLists.txt

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install cmake ninja pkg-config

      - name: Fetch MoltenVK dependency
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail

          if [ ! -d externals/MoltenVK/.git ]; then
            git clone https://github.com/shadPS4-emu/ext-MoltenVK.git \
              externals/MoltenVK
          fi

          git -C externals/MoltenVK checkout \
            a14cbf433414aa95da7046694b069f0f3f9263a5

          test -f externals/MoltenVK/CMakeLists.txt

      - name: Patch MoltenVK for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path

          common_path = Path("externals/MoltenVK/Common/CMakeLists.txt")
          common = common_path.read_text()

          old = "\n".join([
              "        find_library(APPKIT_LIBRARY AppKit REQUIRED)",
              "        target_link_libraries(MoltenVK_Common PUBLIC ${APPKIT_LIBRARY})",
          ])

          new = "\n".join([
              '        if(NOT CMAKE_SYSTEM_NAME STREQUAL "iOS")',
              "            find_library(APPKIT_LIBRARY AppKit REQUIRED)",
              "            target_link_libraries(MoltenVK_Common PUBLIC ${APPKIT_LIBRARY})",
              "        endif()",
          ])

          if new in common:
              print("MoltenVK AppKit patch already present")
          elif old in common:
              common_path.write_text(common.replace(old, new, 1))
              print("Applied MoltenVK AppKit patch")
          else:
              raise SystemExit(
                  "ERROR: Expected AppKit block not found in "
                  "MoltenVK/Common/CMakeLists.txt"
              )

          molten_path = Path("externals/MoltenVK/CMakeLists.txt")
          molten = molten_path.read_text()
          marker = 'add_subdirectory("MoltenVK")'
          addition = (
              'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n'
              '    target_link_libraries(MoltenVK PRIVATE '
              '"-framework UIKit" "-framework CoreGraphics")\n'
              'endif()'
          )

          if "framework UIKit" in molten:
              print("MoltenVK iOS framework patch already present")
          elif marker in molten:
              molten_path.write_text(
                  molten.replace(marker, marker + "\n" + addition, 1)
              )
              print("Applied MoltenVK iOS framework patch")
          else:
              raise SystemExit(
                  "ERROR: MoltenVK target declaration not found"
              )
          PYTHON

          grep -n -C 3 APPKIT_LIBRARY \
            externals/MoltenVK/Common/CMakeLists.txt

      - name: Configure iOS ARM64
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$IOS_SDK"

          cmake -S . -B build-shadios-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF

      - name: Build emulator library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          cmake --build build-shadios-ios \
            --target shadps4 \
            --parallel 3

      - name: Package library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail

          mkdir -p ../shadios-artifact

          find build-shadios-ios \
            -type f \
            -name 'libshadps4.a' \
            -exec cp {} ../shadios-artifact/ \;

          test -f ../shadios-artifact/libshadps4.a

          xcrun lipo -info ../shadios-artifact/libshadps4.a

          cp build-shadios-ios/CMakeCache.txt \
            ../shadios-artifact/

      - name: Upload iOS ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-iOS-arm64-library
          path: ShadiOS/shadios-artifact/
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-build-diagnostics
          path: |
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeFiles/CMakeConfigureLog.yaml
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeCache.txt
          if-no-files-found: ignore
