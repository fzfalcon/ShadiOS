
name: Build ShadiOS iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4
        with:
          ref: main
          path: ShadiOS

      - name: Checkout official shadPS4
        uses: actions/checkout@v4
        with:
          repository: shadps4-emu/shadPS4
          ref: c7e065d1b415be16c23e260a21f1dd8bbfc4cb57
          path: ShadiOS/upstream-shadPS4
          submodules: recursive

      - name: Apply ShadiOS iOS patch
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          test -f ../shadios-ios-changes.patch
          git apply --check ../shadios-ios-changes.patch
          git apply ../shadios-ios-changes.patch

      - name: Verify iOS source
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          test -f src/platform/ios/shadps4_ios_api.cpp
          grep -n -A15 'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")' CMakeLists.txt

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Fetch MoltenVK dependency
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          git clone https://github.com/shadPS4-emu/ext-MoltenVK.git externals/MoltenVK
          git -C externals/MoltenVK checkout a14cbf433414aa95da7046694b069f0f3f9263a5
          test -f externals/MoltenVK/Common/CMakeLists.txt
          test -f externals/MoltenVK/CMakeLists.txt

      - name: Patch MoltenVK platform frameworks
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("externals/MoltenVK/Common/CMakeLists.txt")
          s = p.read_text()

          s = re.sub(
              r'(?m)^[ \t]*find_library\((?:APPKIT_LIBRARY AppKit|IOKIT_LIBRARY IOKit) REQUIRED\)[ \t]*\n?',
              '',
              s
          )
          s = re.sub(
              r'(?m)^[ \t]*target_link_libraries\(MoltenVK_Common PUBLIC \$\{(?:APPKIT_LIBRARY|IOKIT_LIBRARY)\}\)[ \t]*\n?',
              '',
              s
          )
          s = re.sub(
              r'(?m)^[ \t]*\$\{(?:APPKIT_LIBRARY|IOKIT_LIBRARY)\}[ \t]*\n',
              '',
              s
          )

          marker = "# ShadiOS macOS-only framework dependencies"
          if marker not in s:
              s += (
                  "\n\n" + marker + "\n"
                  'if(CMAKE_SYSTEM_NAME STREQUAL "Darwin")\n'
                  '    find_library(APPKIT_LIBRARY AppKit REQUIRED)\n'
                  '    find_library(IOKIT_LIBRARY IOKit REQUIRED)\n'
                  '    target_link_libraries(MoltenVK_Common PUBLIC '
                  '${APPKIT_LIBRARY} ${IOKIT_LIBRARY})\n'
                  'endif()\n'
              )

          p.write_text(s)
          print("MoltenVK platform framework patch applied.")
          PY

          python3 - <<'PY'
          from pathlib import Path

          p = Path("externals/MoltenVK/CMakeLists.txt")
          s = p.read_text()
          marker = 'add_subdirectory("MoltenVK")'

          if marker not in s:
              raise SystemExit("MoltenVK target declaration not found")

          if "framework UIKit" not in s:
              addition = (
                  marker + "\n"
                  'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n'
                  '    target_link_libraries(MoltenVK PRIVATE "-framework UIKit" "-framework CoreGraphics")\n'
                  "endif()"
              )
              p.write_text(s.replace(marker, addition, 1))

          print("MoltenVK iOS framework configuration applied.")
          PY

      - name: Build native macOS font generator
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          mkdir -p host-tools
          clang++ -std=c++17 \
            externals/imgui/misc/fonts/binary_to_compressed_c.cpp \
            -o host-tools/Dear_ImGui_FontEmbed
          chmod +x host-tools/Dear_ImGui_FontEmbed
          file host-tools/Dear_ImGui_FontEmbed
          host-tools/Dear_ImGui_FontEmbed --help || true

      - name: Configure host font generator for cross-compilation
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/imgui/renderer/CMakeLists.txt")
          s = p.read_text()

          old_target = (
              'add_executable(Dear_ImGui_FontEmbed '
              '${CMAKE_SOURCE_DIR}/externals/imgui/misc/fonts/binary_to_compressed_c.cpp)'
          )

          new_target = """if(CMAKE_CROSSCOMPILING AND HOST_FONT_EMBED_EXECUTABLE)
              set(FONT_EMBED_COMMAND "${HOST_FONT_EMBED_EXECUTABLE}")
              set(FONT_EMBED_DEPENDENCY "")
          else()
              add_executable(Dear_ImGui_FontEmbed ${CMAKE_SOURCE_DIR}/externals/imgui/misc/fonts/binary_to_compressed_c.cpp)
              set(FONT_EMBED_COMMAND "$<TARGET_FILE:Dear_ImGui_FontEmbed>")
              set(FONT_EMBED_DEPENDENCY Dear_ImGui_FontEmbed)
          endif()"""

          if "set(FONT_EMBED_COMMAND" not in s:
              if old_target not in s:
                  raise SystemExit("Font generator target declaration not found")
              s = s.replace(old_target, new_target, 1)

          old_command = (
              'COMMAND $<TARGET_FILE:Dear_ImGui_FontEmbed> -nostatic '
          )
          if old_command in s:
              s = s.replace(
                  old_command,
                  'COMMAND ${FONT_EMBED_COMMAND} -nostatic ',
                  1
              )
          elif 'COMMAND ${FONT_EMBED_COMMAND} -nostatic ' not in s:
              raise SystemExit("Font generator command not found")

          old_depends = (
              'DEPENDS Dear_ImGui_FontEmbed "fonts/${FONT_FILE}"'
          )
          if old_depends in s:
              s = s.replace(
                  old_depends,
                  'DEPENDS ${FONT_EMBED_DEPENDENCY} "fonts/${FONT_FILE}"',
                  1
              )
          elif 'DEPENDS ${FONT_EMBED_DEPENDENCY} "fonts/${FONT_FILE}"' not in s:
              raise SystemExit("Font generator DEPENDS line not found")

          p.write_text(s)
          print("CMake now supports the host-native font generator.")
          PY

          grep -n -A12 'FONT_EMBED_COMMAND' src/imgui/renderer/CMakeLists.txt

      - name: Enable Objective-C languages for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("CMakeLists.txt")
          s = p.read_text()

          if "enable_language(OBJCXX)" in s:
              print("Objective-C++ language already enabled.")
              raise SystemExit(0)

          match = re.search(r'\bproject\s*\([^)]*\)', s, re.IGNORECASE)
          if not match:
              raise SystemExit("Could not locate root project() command")

          insertion = (
              match.group(0)
              + '\n\nif(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n'
              + '    enable_language(OBJC)\n'
              + '    enable_language(OBJCXX)\n'
              + 'endif()\n'
          )

          s = s[:match.start()] + insertion + s[match.end():]
          p.write_text(s)
          print("Objective-C and Objective-C++ enabled for iOS.")
          PY

      - name: Configure iOS ARM64
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          cmake -S . -B build-shadios-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=0 \
            -DHOST_FONT_EMBED_EXECUTABLE="${PWD}/host-tools/Dear_ImGui_FontEmbed"

      - name: Build emulator library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          cmake --build build-shadios-ios --target shadps4 --parallel 1

      - name: Package library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          mkdir -p ../shadios-artifact
          find build-shadios-ios -type f -name 'libshadps4.a' \
            -exec cp {} ../shadios-artifact/ \;
          test -f ../shadios-artifact/libshadps4.a
          xcrun lipo -info ../shadios-artifact/libshadps4.a
          cp build-shadios-ios/CMakeCache.txt ../shadios-artifact/

      - name: Upload iOS ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-iOS-arm64-library
          path: ShadiOS/shadios-artifact/
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShadiOS-build-diagnostics
          path: |
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeFiles/CMakeConfigureLog.yaml
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeFiles/CMakeOutput.log
            ShadiOS/upstream-shadPS4/build-shadios-ios/CMakeCache.txt
          if-no-files-found: ignore
