name: Build ShadiOS iOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout ShadiOS
        uses: actions/checkout@v4
        with:
          path: ShadiOS

      - name: Checkout upstream shadPS4
        uses: actions/checkout@v4
        with:
          repository: shadPS4-emu/shadPS4
          ref: c7e065d1b415be16c23e260a21f1dd8bbfc4cb57
          path: ShadiOS/upstream-shadPS4
          submodules: recursive

      - name: Apply ShadiOS iOS changes
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          test -f ../shadios-ios-changes.patch
          git apply --check ../shadios-ios-changes.patch
          git apply ../shadios-ios-changes.patch

      - name: Patch ImGuiFileDialog for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          from pathlib import Path

          p = Path("externals/ImGuiFileDialog/ImGuiFileDialog.cpp")
          s = p.read_text()
          start = s.index("    bool CreateDirectoryIfNotExist(")
          end = s.index("    std::vector<std::string> GetDrivesList()", start)
          function = s[start:end]

          old = (
              "#elif defined(_IGFD_UNIX_)\n"
              "                char buffer[PATH_MAX] = {};"
          )
          new = (
              "#elif defined(_IGFD_UNIX_)\n"
              "#if defined(__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__)\n"
              "                namespace fs = std::filesystem;\n"
              "                std::error_code ec;\n"
              "                fs::create_directories(fs::path(vName), ec);\n"
              "                res = !ec;\n"
              "#else\n"
              "                char buffer[PATH_MAX] = {};"
          )
          if function.count(old) != 1:
              raise SystemExit("STOP: original directory-creation code not found exactly once.")

          function = function.replace(old, new, 1)
          marker = "#endif  // _IGFD_WIN_"
          if function.count(marker) != 1:
              raise SystemExit("STOP: expected preprocessor ending not found exactly once.")

          function = function.replace(marker, "#endif\n#endif  // _IGFD_WIN_", 1)
          p.write_text(s[:start] + function + s[end:])
          print("Applied iOS-safe directory creation patch.")
          PYTHON

      - name: Disable unsupported libusb eventfd and pipe2 on iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          from pathlib import Path

          p = Path("externals/libusb/CMakeLists.txt")
          s = p.read_text()
          target = "    check_include_files(sys/eventfd.h    HAVE_EVENTFD)"
          replacement = (
              target + "\n"
              "\n"
              "    # iOS lacks eventfd and pipe2; use libusb's portable pipe() fallback.\n"
              "    if(CMAKE_SYSTEM_NAME STREQUAL \"iOS\")\n"
              "        set(HAVE_EVENTFD FALSE)\n"
              "        set(HAVE_PIPE2 FALSE)\n"
              "    endif()"
          )
          if s.count(target) != 1:
              raise SystemExit("STOP: expected libusb eventfd check not found exactly once.")
          p.write_text(s.replace(target, replacement, 1))
          print("Configured libusb to use pipe() on iOS.")
          PYTHON

      - name: Verify iOS source changes
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          test -f src/platform/ios/shadps4_ios_api.cpp
          grep -n -A15 'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")' CMakeLists.txt
          grep -n -A18 'bool CreateDirectoryIfNotExist' externals/ImGuiFileDialog/ImGuiFileDialog.cpp

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install cmake ninja pkg-config
          cmake --version

      - name: Fetch MoltenVK dependency
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          if [ ! -d externals/MoltenVK/.git ]; then
            rm -rf externals/MoltenVK
            git clone https://github.com/shadPS4-emu/ext-MoltenVK.git externals/MoltenVK
          fi
          git -C externals/MoltenVK checkout a14cbf433414aa95da7046694b069f0f3f9263a5
          test -f externals/MoltenVK/CMakeLists.txt
          test -f externals/MoltenVK/Common/CMakeLists.txt

      - name: Patch MoltenVK for iOS
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          common_path = Path("externals/MoltenVK/Common/CMakeLists.txt")
          lines = common_path.read_text().splitlines()
          filtered = [
              line for line in lines
              if "APPKIT_LIBRARY" not in line and not re.search(r"\bAppKit\b", line)
          ]
          common_path.write_text("\n".join(filtered) + "\n")

          root_path = Path("externals/MoltenVK/CMakeLists.txt")
          root = root_path.read_text()
          marker = 'add_subdirectory("MoltenVK")'
          if "framework UIKit" not in root:
              if marker in root:
                  addition = (
                      'add_subdirectory("MoltenVK")\n\n'
                      'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n'
                      '    target_link_libraries(MoltenVK PRIVATE\n'
                      '        "-framework UIKit"\n'
                      '        "-framework CoreGraphics"\n'
                      '    )\n'
                      'endif()'
                  )
                  root_path.write_text(root.replace(marker, addition, 1))
              else:
                  print("WARNING: MoltenVK subdirectory marker not found; skipped framework-link addition")

          remaining = common_path.read_text()
          if "APPKIT_LIBRARY" in remaining or re.search(r"\bAppKit\b", remaining):
              raise SystemExit("ERROR: AppKit reference remains in iOS Common CMake file")
          print("MoltenVK iOS patch completed.")
          PYTHON

      - name: Diagnose Objective-C++ toolchain
        run: |
          set -euo pipefail
          xcrun --find clang
          xcrun --find clang++
          cmake --version
          cmake --help-variable CMAKE_OBJCXX_COMPILE_OBJECT

      - name: Build native ImGui font generator
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          clang++ -std=c++11 \
            externals/imgui/misc/fonts/binary_to_compressed_c.cpp \
            -o "$RUNNER_TEMP/Dear_ImGui_FontEmbed"
          python3 - "$RUNNER_TEMP/Dear_ImGui_FontEmbed" <<'PYTHON'
          from pathlib import Path
          import sys

          p = Path("src/imgui/renderer/CMakeLists.txt")
          s = p.read_text()
          old = "add_executable(Dear_ImGui_FontEmbed ${CMAKE_SOURCE_DIR}/externals/imgui/misc/fonts/binary_to_compressed_c.cpp)"
          new = (
              "add_executable(Dear_ImGui_FontEmbed IMPORTED GLOBAL)\n"
              "set_target_properties(Dear_ImGui_FontEmbed PROPERTIES\n"
              f'    IMPORTED_LOCATION "{sys.argv[1]}"\n'
              ")"
          )
          if s.count(old) != 1:
              raise SystemExit("STOP: expected font-generator target not found exactly once.")

          updated = s.replace(old, new, 1)
          dependency = 'DEPENDS Dear_ImGui_FontEmbed "fonts/${FONT_FILE}"'
          if updated.count(dependency) != 1:
              raise SystemExit("STOP: expected dependency line not found.")
          updated = updated.replace(
              dependency,
              'DEPENDS "fonts/${FONT_FILE}"',
              1,
          )
          p.write_text(updated)
          print("Native font-generator fix applied.")
          PYTHON

      - name: Configure iOS ARM64
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$IOS_SDK"
          cmake -S . -B build-shadios-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OBJCXX_COMPILER="$(xcrun --find clang++)" \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF

      - name: Generate ImGui fonts first
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          cmake --build build-shadios-ios --target ImGui_Resources --parallel 1

      - name: Build emulator library
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          cmake --build build-shadios-ios --target shadps4 --parallel 1

      - name: Package library and diagnostics
        if: always()
        working-directory: ShadiOS/upstream-shadPS4
        run: |
          set -euo pipefail
          mkdir -p ../shadios-artifact
          find build-shadios-ios -type f -name 'libshadps4.a' -exec cp {} ../shadios-artifact/ \; || true
          {
            echo "ShadiOS iOS ARM64 build diagnostics"
            echo "Commit: $(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo
            echo "MoltenVK AppKit references:"
            grep -R -n 'APPKIT_LIBRARY\|find_library.*AppKit' externals/MoltenVK/Common/CMakeLists.txt || true
            echo
            echo "CMake cache:"
            if [ -f build-shadios-ios/CMakeCache.txt ]; then
              grep -E 'CMAKE_SYSTEM_NAME:|CMAKE_OSX_SYSROOT:|CMAKE_OSX_ARCHITECTURES:|CMAKE_TRY_COMPILE_TARGET_TYPE:|ALLOWS_ONESHOT' build-shadios-ios/CMakeCache.txt || true
            fi
          } > ../shadios-artifact/build-diagnostics.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadios-ios-arm64
          path: ShadiOS/shadios-artifact/
          if-no-files-found: warn
